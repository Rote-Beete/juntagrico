stages:
  - test

variables:
  UV_VERSION: '0.10.10'

default:
  image: python:3.13-alpine

.setup-uv: &setup-uv
  - apk add make
  - which pipx >/dev/null || pip install pipx && export PATH="$(pipx environment --value PIPX_BIN_DIR):$PATH"
  - pipx install "uv==$UV_VERSION"

.lint:
  stage: test
  before_script:
    - *setup-uv
    - uv sync --no-default-groups --group dev

ruff:
  extends: .lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

djlint:
  extends: .lint
  script:
    # djlint includes a default exclude of "build" that is matched against
    # the entire path of the file and thus will include paths like `/builds/rokoli/rotebeete`
    # resulting in no files being found for linting m)
    # see: https://github.com/djlint/djLint/issues/1028
    - uv run djlint --exclude '--none--' --use-gitignore --check .

test:
  stage: test
  variables:
    ROTEBEETE_SECRET_KEY: 'VerySecretKey'
    ROTEBEETE_ALLOWED_HOSTS: '127.0.0.1'
    ROTEBEETE_CSRF_TRUSTED_ORIGINS: 'http://localhost:1234,http://127.0.0.1:1234'
    ROTEBEETE_EMAIL_HOST_PASSWORD: 'VerySecretPassword'
  before_script:
    - apk add postgresql-dev
    - *setup-uv
    - uv sync --group test
    - uv run python manage.py collectstatic --noinput
  script:
    - uv run pytest
