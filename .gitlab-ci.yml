stages:
  - test
  - deploy

variables:
  UV_VERSION: '0.10.10'

default:
  image: python:3.13-slim-trixie

.setup-uv: &setup-uv
  - apt-get update -y
  - apt-get install -y --no-install-recommends make build-essential libpq-dev
  - rm -rf /var/lib/apt/lists/*
  - which pipx >/dev/null || pip install pipx && export PATH="$(pipx environment --value PIPX_BIN_DIR):$PATH"
  - pipx install "uv==$UV_VERSION"

lint:
  stage: test
  before_script:
    - *setup-uv
  script:
    - make lint-check

test:
  stage: test
  variables:
    ROTEBEETE_SECRET_KEY: 'VerySecretKey'
    ROTEBEETE_ALLOWED_HOSTS: '127.0.0.1'
    ROTEBEETE_CSRF_TRUSTED_ORIGINS: 'http://localhost:1234,http://127.0.0.1:1234'
    ROTEBEETE_EMAIL_HOST_PASSWORD: 'VerySecretPassword'
  before_script:
    - *setup-uv
  script:
    - make test

deploy::container-image:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']

  variables:
    DOCKERFILE: Dockerfile

  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      else
        export IMAGE_TAG="rolling"
      fi

      export IMAGE_NAME="${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"

      mkdir -p /kaniko/.docker

      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${DOCKERFILE}" \
        --destination "${IMAGE_NAME}" \
        --cache=true \
        --build-arg "build_version=${CI_COMMIT_SHA}"

.deploy-to-env:
  stage: deploy
  image: alpine
  before_script:
    - apk add curl
  script:
    - curl --fail-with-body --request POST --user "$DEPLOYMENT_HOOK_AUTH" "$DEPLOYMENT_HOOK_URL"

deploy::to-staging:
  extends: .deploy-to-env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  needs:
    - job: deploy::container-image
  environment:
    name: staging
    url: https://juntagrico.staging.roko.li
