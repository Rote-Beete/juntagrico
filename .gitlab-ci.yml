include:
  - project: 'kmohrf/gitlabfilet'
    ref: 'v2.2.0'
    file:
      - '/templates/container.gitlab-ci.yml'

stages:
  - test
  - deploy

variables:
  UV_VERSION: '0.10.10'

default:
  image: python:3.13-alpine

.setup-uv: &setup-uv
  - apk add make
  - which pipx >/dev/null || pip install pipx && export PATH="$(pipx environment --value PIPX_BIN_DIR):$PATH"
  - pipx install "uv==$UV_VERSION"

lint:
  stage: test
  before_script:
    - *setup-uv
  script:
    - make lint-check

test:
  stage: test
  variables:
    ROTEBEETE_SECRET_KEY: 'VerySecretKey'
    ROTEBEETE_ALLOWED_HOSTS: '127.0.0.1'
    ROTEBEETE_CSRF_TRUSTED_ORIGINS: 'http://localhost:1234,http://127.0.0.1:1234'
    ROTEBEETE_EMAIL_HOST_PASSWORD: 'VerySecretPassword'
  before_script:
    - apk add postgresql-dev
    - *setup-uv
  script:
    - make test

deploy::container-image:
  variables:
    KANIKO_ARGS: --skip-unused-stages
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\/v.+/
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual

.deploy-to-env:
  stage: deploy
  image: alpine
  before_script:
    - apk add curl
  script:
    - curl --fail-with-body --request POST --user "$DEPLOYMENT_HOOK_AUTH" "$DEPLOYMENT_HOOK_URL"

deploy::to-staging:
  extends: .deploy-to-env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: deploy::container-image
  environment:
    name: staging
    url: https://juntagrico.staging.roko.li
