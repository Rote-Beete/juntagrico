{% if member.transition.membership_needs_review %}
    <div class="alert alert-danger">
        <strong>Bitte bestätige die Aktualität der unten stehenden Angaben:</strong>
        <form method="post" action="{% url 'confirm-membership-review' %}">
            {% csrf_token %}
            <button class="btn btn-success">
                <strong>Meine Angaben sind aktuell</strong>
            </button>
        </form>
    </div>
{% endif %}
