#!!!DON'T YOUS THIS COMPOSE FILE FOR PRODUCTION. ONLY FOR DEV PURPOSES!!!!

services:
  redis:
    image: redis:7-alpine
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: rb
      POSTGRES_USER: rb
      POSTGRES_PASSWORD: rb
    env_file: [container/env, .env.docker]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rb']
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    image: git-registry.hack-hro.de:443/rokoli/rotebeete:rolling
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: [container/env, .env.local]
    environment:
      ROTEBEETE_DEFENDER_REDIS_URL: 'redis://redis:6379/0'
      ROTEBEETE_DATABASE_URL: 'postgres://rb:rb@postgres:5432/rb'
    volumes:
      - rotebeete-data:/var/lib/rotebeete

  nginx:
    image: nginx
    depends_on: [backend]
    volumes:
      - ./container/nginx-server.conf:/etc/nginx/nginx.conf
      - ./container/nginx-app.conf:/etc/nginx/snippets/rotebeete.conf
      - rotebeete-data:/var/lib/rotebeete:ro
    ports: ['5678:8537']

volumes:
  rotebeete-data:
  postgres-data:
