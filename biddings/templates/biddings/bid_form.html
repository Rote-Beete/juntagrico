{% extends "base.html" %}
{% load i18n %}
{% block page_title %}
    <h3>{% trans "Beitragsrunden Gebot" %}</h3>
{% endblock %}
{% block content %}
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <input class="btn" type="submit" value="Save">
        {% if object %}
            <a class="btn delete" href={% url "delete_bid" object.pk %}>Delete</a>
        {% endif %}
        <a class="btn" href={% url "biddingrounds" %}>Cancel</a>
    </form>
{% endblock %}
