[tool.poetry]
name = "rotebeete"
version = "0.1.0"
description = ""
authors = ["alexgorji <aligorji@hotmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
juntagrico = "1.6.5"
django-oauth-toolkit = "^3.0.1"
psycopg2 = "^2.9.10"
django-defender = "^0.9.8"
setuptools = "^75.8.0"


[tool.poetry.group.test.dependencies]
pytest-django = "^4.10.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.6"
ipython = "^8.32.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = ["**/migrations/**"]

[tool.ruff.format]
quote-style = "preserve"
