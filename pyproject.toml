[project]
name = "rotebeete"
version = "0.1.0"
description = ""
authors = [{name = "alexgorji", email = "ag@roko.li"}]
requires-python = ">=3.13"
dependencies = [
    "juntagrico==2.0.7",
    "django-oauth-toolkit>=3.0.1",
    "django-defender>=0.9.8",
    "setuptools==71.0.0",
    "python-dotenv>=1.0.1",
    "bnb>=0.2.0",
    "django>=4.2.29",
    "django-environ>=0.13.0",
    "uvicorn>=0.42.0",
    "psycopg2>=2.9.12",
]

[dependency-groups]
test = [
    "pytest-django>=4.10.0",
]
dev = [
    "ruff>=0.9.6",
    "ipython>=8.32.0",
    "djlint>=1.36.4",
    "pip-audit>=2.9.0",
    "faker>=40.1.2",
]

[[tool.uv.index]]
name = "rokoli-bnb"
url = "https://git.hack-hro.de/api/v4/projects/495/packages/pypi/simple"
explicit = true

[tool.uv.sources]
bnb = { index = "rokoli-bnb" }

[tool.ruff]
exclude = ["**/migrations/**"]

[tool.ruff.format]
quote-style = "preserve"

[tool.djlint]
ignore = "H006,H031,H030"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rotebeete.settings"
python_files = ["tests.py", "test_*.py"]
pythonpath = "."
markers = [
    "wip: work in progress tests",
    "only: run only selected tests",
]
