[tool.poetry]
name = "rotebeete"
version = "0.1.0"
description = ""
authors = ["alexgorji <ag@roko.li>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
juntagrico = "1.6.5"
django-oauth-toolkit = "^3.0.1"
django-defender = "^0.9.8"
setuptools = "^75.8.0"
python-dotenv = "^1.0.1"
dj-database-url = "^2.3.0"
bnb = {version = "^0.2.0", source = "rokoli-bnb"}

[tool.poetry.group.test.dependencies]
pytest-django = "^4.10.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.6"
ipython = "^8.32.0"
djlint = "^1.36.4"


[[tool.poetry.source]]
name = "rokoli-bnb"
url = "https://git.hack-hro.de/api/v4/projects/495/packages/pypi/simple"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = ["**/migrations/**"]

[tool.ruff.format]
quote-style = "preserve"

[tool.djlint]
ignore = "H006,H031,H030"
